name: Pull Request Checks

on:
  pull_request:
  push:
    branches-ignore:
      - master

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - run: node --test src/tests/react/utils/contractClientMatch.test.js src/tests/react/utils/nativePdfSource.test.js
